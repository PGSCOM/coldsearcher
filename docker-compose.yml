version: "3.8"

services:

  whisper:
    # image: onerahmet/openai-whisper-asr-webservice:latest   # CPU
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu  # GPU
    container_name: whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=turbo          # tiny | base | small | medium | large-v3
      - ASR_ENGINE=openai_whisper
      - ASR_DEFAULT_LANGUAGE=es  # precarga idioma por defecto
    volumes:
      - whisper_cache:/root/.cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

